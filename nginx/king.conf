# Автономный конфиг nginx для KingPromotion.
# Запускается отдельно от системного nginx:
#   sudo nginx -c ~/king/nginx/king.conf
# Остановка:
#   sudo nginx -s stop -c ~/king/nginx/king.conf
#
# Отдаёт прод-сборку frontend/dist с gzip и проксирует API на FastAPI (8000).

worker_processes 1;
# Воркеры должны работать от владельца проекта: /home/ava закрыта для «others»
# (drwxr-x---), поэтому пользователь по умолчанию (nobody) не может прочитать
# frontend/dist. Если username отличается от ava — поменяй здесь.
user ava;
pid /tmp/king-nginx.pid;
error_log /tmp/king-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # --- Сжатие (главный выигрыш по скорости) ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        text/css
        text/plain
        image/svg+xml
        application/wasm;

    server {
        listen 8080;
        server_name _;

        # Прод-сборка frontend (npm run build)
        root /home/ava/king/frontend/dist;
        index index.html;

        # SPA: любой несуществующий путь отдаём на index.html.
        # index.html не кэшируем — он должен всегда быть свежим, иначе браузер
        # будет ссылаться на старые имена чанков.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Хэшированные ассеты Vite — кэшируем навсегда
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # --- Проксирование API на FastAPI (127.0.0.1:8000) ---
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /price {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        # Webhook-пути (Telegram/VK/social) — на случай прямых вызовов
        location /telegram/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location /vk/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location /social/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }
    }
}
